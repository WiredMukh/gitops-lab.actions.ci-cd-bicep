name: CI-CD

on:
  push:
    branches:
      - main
    paths-ignore:
      - README.md

  pull_request:
    branches:
      - main

  workflow_dispatch:

env:
  AZURE_RG: RG3
  AZURE_SUBSCRIPTION: ${{ secrets.AZURE_SUBSCRIPTION }}
  AZURE_LOCATION: WestEurope
  AZURE_WEBAPP_NAME: labapp-mywebapp

jobs:

  Build-Job:
    runs-on: ubuntu-latest

    env:
      configuration: Release

    steps:
      - name: Checkout Sources
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration ${{ env.configuration }}

      - name: Test
        run: dotnet test --no-build --verbosity normal --configuration ${{ env.configuration }}

      - name: Publish
        run: |
          dotnet publish \
            --configuration ${{ env.configuration }} \
            --output ${{ runner.temp }}/publish

      - name: Upload Publish Artifact
        uses: actions/upload-artifact@v4
        with:
          name: publish_artifact
          path: ${{ runner.temp }}/publish
          retention-days: 30

      - name: Upload Templates Artifact
        uses: actions/upload-artifact@v4
        with:
          name: templates_artifact
          path: ./templates/*
          retention-days: 30


  RG-Job:
    runs-on: ubuntu-latest

    needs:
      - Build-Job

    steps:
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create Resource Group
        uses: Azure/cli@v2
        with:
          inlineScript: |
            az group create \
              --name "${{ env.AZURE_RG }}" \
              --location "${{ env.AZURE_LOCATION }}"


  WebApp-Job:
    runs-on: ubuntu-latest

    needs:
      - RG-Job

    steps:
      - name: Download Templates
        uses: actions/download-artifact@v4
        with:
          name: templates_artifact
          path: ${{ runner.temp }}/templates

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy BICEP template
        uses: azure/arm-deploy@v2
        id: deploywebapp
        with:
          deploymentName: create-webapp
          subscriptionId: ${{ env.AZURE_SUBSCRIPTION }}
          resourceGroupName: ${{ env.AZURE_RG }}
          template: ${{ runner.temp }}/templates/webapp.bicep
          parameters: >
            location=${{ env.AZURE_LOCATION }}
            appName=${{ env.AZURE_WEBAPP_NAME }}

      - name: Download Publish
        uses: actions/download-artifact@v4
        with:
          name: publish_artifact
          path: ${{ runner.temp }}/publish

      - name: Deploy to Azure Web App
        uses: Azure/webapps-deploy@v3
        with:
          app-name: ${{ steps.deploywebapp.outputs.webappname }}
          package: ${{ runner.temp }}/publish
